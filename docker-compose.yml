services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmatrace-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmatrace-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/private_documents:/app/private_documents
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in the root .env file}
      SYNC_DATABASE_URL: ${DOCKER_SYNC_DATABASE_URL:?Set DOCKER_SYNC_DATABASE_URL in the root .env file}
      BLOCKCHAIN_MODE: test
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmatrace-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
