services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmatrace-postgres
    environment:
      POSTGRES_USER: pharmatrace
      POSTGRES_PASSWORD: pharmatrace_secure_password_2026
      POSTGRES_DB: pharmatrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmatrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharmatrace-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pharmatrace:pharmatrace_secure_password_2026@postgres:5432/pharmatrace
      SYNC_DATABASE_URL: postgresql+psycopg2://pharmatrace:pharmatrace_secure_password_2026@postgres:5432/pharmatrace
      SECRET_KEY: prod_secret_key_pharmatrace_blockchain_supply_chain_2026_super_secure_32_bytes
      BLOCKCHAIN_MODE: test # Set to 'fabric' when connecting to live Hyperledger Fabric peer
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharmatrace-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:

