name: pharmatrace_frontend
description: "PharmaTrace - Blockchain-Backed Pharmaceutical Supply Chain Traceability"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & Network
  dio: ^5.7.0
  
  # State management & Routing
  provider: ^6.1.2
  go_router: ^14.6.2
  
  # QR Code Generation & Display
  qr_flutter: ^4.1.0
  
  # Storage for JWT Token
  shared_preferences: ^2.3.3
  
  # Date formatting
  intl: ^0.19.0
  
  # Icons & UI
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
